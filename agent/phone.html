<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call ClearView At-Home</title>
<style>
  body { margin: 0; background: #e9ecef; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .phone { width: 340px; height: 640px; background: #111; border-radius: 42px; padding: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .screen { background: linear-gradient(#1f2937, #0b1220); height: 100%; border-radius: 30px; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 48px 20px 28px; box-sizing: border-box; }
  .avatar { width: 96px; height: 96px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; }
  .name { margin-top: 18px; font-size: 22px; font-weight: 600; }
  .num { color: #9ca3af; font-size: 14px; margin-top: 4px; }
  #state { margin-top: 12px; color: #9ca3af; min-height: 22px; }
  #caption { margin-top: 18px; font-size: 14px; line-height: 1.4; text-align: center; min-height: 90px; color: #e5e7eb; }
  #you { color: #93c5fd; font-size: 13px; min-height: 18px; text-align: center; }
  .spacer { flex: 1; }
  .btn { width: 68px; height: 68px; border-radius: 50%; border: 0; font-size: 28px; cursor: pointer; color: #fff; }
  #call { background: #22c55e; }
  #hang { background: #ef4444; display: none; }
  .typed { display: none; margin-bottom: 16px; width: 100%; }
  .typed input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 0; font-size: 13px; }
  .foot { font-size: 11px; color: #6b7280; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div class="phone"><div class="screen">
  <div class="avatar">C</div>
  <div class="name">ClearView At-Home</div>
  <div class="num">+91 80 4000 1234 (demo)</div>
  <div id="state">Ready to call</div>
  <div id="caption"></div>
  <div id="you"></div>
  <div class="spacer"></div>
  <div class="typed" id="typedbox"><input id="typed" placeholder="Type instead of speaking, then Enter"></div>
  <button class="btn" id="call">📞</button>
  <button class="btn" id="hang">📵</button>
  <div class="foot">AI demo call. Fictional brand. Please don't share real personal details.</div>
</div></div>

<script>
let sid = null, active = false, rec = null, tick = null, seconds = 0;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function setState(t) { $("state").textContent = t; }

function ring() {
  // two short ring tones using the Web Audio API
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < 2; i++) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 440; g.gain.value = 0.15;
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + i * 1.2);
      o.stop(ctx.currentTime + i * 1.2 + 0.8);
    }
  } catch (e) {}
}

function speak(text) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-IN";
    u.onend = res; u.onerror = res;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  });
}

function fmt(s) {
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

async function reply(text) {
  $("caption").textContent = "Charlie: " + text;
  await speak(text);
  if (active) listen();
}

async function send(text) {
  if (!text || !sid || !active) return;
  if (rec) { try { rec.abort(); } catch (e) {} }
  $("you").textContent = "You: " + text;
  $("caption").textContent = "...";
  const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                   body: JSON.stringify({ session_id: sid, text }) });
  const d = await r.json();
  if (active) await reply(d.reply);
}

function listen() {
  if (!SR) { $("you").textContent = "Voice input needs Chrome. Type below."; return; }
  rec = new SR();
  rec.lang = "en-IN";
  rec.interimResults = false;
  rec.onresult = e => send(e.results[0][0].transcript);
  rec.onerror = e => {
    if (e.error === "no-speech" && active) { listen(); return; }
    if (e.error !== "aborted") $("you").textContent = "Didn't catch that. Say it again or type below.";
  };
  try { rec.start(); } catch (e) {}
}

$("call").onclick = async () => {
  $("call").style.display = "none";
  $("hang").style.display = "inline-block";
  $("typedbox").style.display = "block";
  $("caption").textContent = ""; $("you").textContent = "";
  active = true;
  setState("Calling...");
  ring();
  await sleep(2600);
  if (!active) return;
  setState("Connecting...");
  const r = await fetch("/start", { method: "POST" });
  const d = await r.json();
  sid = d.session_id;
  seconds = 0;
  setState("00:00");
  tick = setInterval(() => { seconds++; setState(fmt(seconds)); }, 1000);
  await reply(d.reply);
};

$("hang").onclick = () => {
  active = false; sid = null;
  if (rec) { try { rec.abort(); } catch (e) {} }
  speechSynthesis.cancel();
  clearInterval(tick);
  setState("Call ended · " + fmt(seconds));
  $("caption").textContent = "";
  $("hang").style.display = "none";
  $("call").style.display = "inline-block";
  $("typedbox").style.display = "none";
};

$("typed").addEventListener("keydown", e => {
  if (e.key === "Enter") { const t = $("typed").value.trim(); $("typed").value = ""; send(t); }
});
</script>
</body>
</html>
